name: sigma-check

on:
  push:
    paths:
      - 'sigma/rules/**'
      - 'sigma/requirements.txt'
      - '.github/workflows/sigma-ci.yml'
  pull_request:
    paths:
      - 'sigma/rules/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sigma-cli
        working-directory: sigma
        run: pip install -r requirements.txt

      - name: Install pipeline plugins
        working-directory: sigma
        run: |
          sigma plugin install sysmon
          sigma plugin install windows

      - name: sigma check
        working-directory: sigma
        run: sigma check rules/
